#VRML_SIM R2023b utf8
# template language: javascript

# Robot_B2
# A cylindrical body (radius 0.09 m) with four omnidirectional wheels
# mounted at 45, 135, 225 and 315 degrees around the body (an "X" layout),
# each wheel's rolling axis tangential to the body circle at its mount angle.
#
# Wheel motors/sensors are named:
#   wheel1_45_motor  / wheel1_45_sensor
#   wheel2_135_motor / wheel2_135_sensor
#   wheel3_225_motor / wheel3_225_sensor
#   wheel4_315_motor / wheel4_315_sensor

PROTO Robot_B2 [
  field SFVec3f    translation     0 0 0.03
  field SFRotation rotation        0 0 1 0
  field SFString   name            "Robot_B2"
  field SFString   controller      "team_blue"
  field MFString   controllerArgs  []
  field SFString   customData      ""
  field SFBool     supervisor      FALSE
  field SFBool     synchronization TRUE
  field MFNode     extensionSlot   []
]
{
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    controller IS controller
    controllerArgs IS controllerArgs
    customData IS customData
    supervisor IS supervisor
    synchronization IS synchronization
    children [

      # ---- Compass ----
      Compass {
        translation 0 0 0.03
        name "compass"
      }

      # ---- Distance Sensors ----
      # Front Sensor (pointing +X)
      DistanceSensor {
        translation 0.09 0 0
        rotation 0 0 1 0
        name "ds_front"
        lookupTable [
          0 1000 0
          0.5 0 0
        ]
      }
      # Left Sensor (pointing +Y)
      DistanceSensor {
        translation 0 0.09 0
        rotation 0 0 1 1.570796
        name "ds_left"
        lookupTable [
          0 1000 0
          0.5 0 0
        ]
      }
      # Back Sensor (pointing -X)
      DistanceSensor {
        translation -0.09 0 0
        rotation 0 0 1 3.1415926
        name "ds_back"
        lookupTable [
          0 1000 0
          0.5 0 0
        ]
      }
      # Right Sensor (pointing -Y)
      DistanceSensor {
        translation 0 -0.09 0
        rotation 0 0 1 -1.570796
        name "ds_right"
        lookupTable [
          0 1000 0
          0.5 0 0
        ]
      }
      # ---- GPS (to know robot absolute position) ----
      GPS {
        translation 0 0 0.03
        name "gps"
      }

      # ---- Receiver (to get ball position) ----
      Receiver {
        name "receiver"
      }


      # ---- Visual Details Only ----

      # ---- 3D Body CAD Assembly ----
      Pose {
        translation 0 0 -0.03
        rotation 0.577351 0.577349 0.577351 2.0944
        # scale 0.001 0.001 0.001
        children [
          CadShape {
            url "meshes/black.dae"
          }
        ]
      }





      %<
        // --- configurable constants ---
        const wheelRadius = 0.03;
        const wheelWidth  = 0.01;
        const mountRadius = 0.085;   // distance from body center to wheel axle
        const wheelNames  = ['wheel1_45', 'wheel2_135', 'wheel3_225', 'wheel4_315'];

        for (let i = 0; i <= 3; i = i + 1) {
          const alphaDeg = 45 + i * 90;
          const alpha = alphaDeg * Math.PI / 180;
          const px = mountRadius * Math.cos(alpha);
          const py = mountRadius * Math.sin(alpha);
          const pz = -0.01;
          
          // Tangential direction at this mount angle -> hinge/rolling axis
          const axisX = -Math.sin(alpha);
          const axisY =  Math.cos(alpha);
      >%
      HingeJoint {
        jointParameters HingeJointParameters {
          axis %<= -axisX >% %<= axisY >% 0
          anchor %<= px >% %<= py >% %<= pz >%
        }
        device [
          RotationalMotor {
            name "%<= wheelNames[i] >%_motor"
            maxVelocity 20
            maxTorque 1
          }
          PositionSensor {
            name "%<= wheelNames[i] >%_sensor"
          }
        ]
        endPoint Solid {
          translation %<= px >% %<= py >% %<= pz >%
          # Rotate the Solid's coordinate frame around the Z-axis by alpha.
          # This aligns the Solid's local X-axis radially, and local Y-axis tangentially (matching the hinge axis).
          rotation 0 0 1 %<= -alpha >%
          contactMaterial "omni_wheel"
          children [
            # We rotate the visual shape 90 degrees around its local X-axis (radial) 
            # so the cylinder stands vertically on its rolling edge.
            Pose {
              rotation 1 0 0 1.570796
              children []
            }
          ]
          name "%<= wheelNames[i] >%"
          # We must apply the same rotation to the boundingObject so the physics collision aligns with the visual cylinder.
          boundingObject Pose {
            rotation 1 0 0 1.570796
            children [
              Cylinder {
                height %<= wheelWidth >%
                radius %<= wheelRadius >%
              }
            ]
          }
          physics Physics {
            density -1
            mass 0.05
          }
        }
      }
      %< } >%

      Group {
        children IS extensionSlot
      }
    ]
    boundingObject Pose {
      translation 0 0 0.055
      children [
        Cylinder {
          height 0.18
          radius 0.085
        }
      ]
    }
    physics Physics {
      density -1
      mass 10
    }
  }
}
